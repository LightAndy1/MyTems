name: Release Extension Zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Run tests
        run: bun test

      - name: Verify tag matches manifest version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ "$TAG_NAME" == v* ]]; then
            TAG_VER="${TAG_NAME#v}"
            MANIFEST_VER="$(bun -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version)")"
            if [[ "$TAG_VER" != "$MANIFEST_VER" ]]; then
              echo "Tag $TAG_NAME does not match manifest.json version $MANIFEST_VER"
              exit 1
            fi
          fi

      - name: Build extension zip
        run: |
          MANIFEST_VER="$(bun -e "console.log(JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')).version)")"
          mkdir -p dist/MyTems
          cp manifest.json dist/MyTems/
          cp -R src icons dist/MyTems/
          (cd dist && zip -rq ../mytems.zip MyTems && cp ../mytems.zip "../mytems-v${MANIFEST_VER}.zip")

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mytems.zip
            mytems-v*.zip
