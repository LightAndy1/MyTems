<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyTems</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <div class="brand-lockup">
          <svg width="26" height="26" viewBox="0 0 36 36" fill="none" aria-hidden="true">
            <rect width="36" height="36" rx="10" fill="#0057FF" />
            <rect x="6.5" y="10.5" width="23" height="15" rx="7.5" fill="#FFFFFF" />
            <path d="M18 10.5v15" stroke="#0057FF" stroke-width="2" />
            <path d="M11.2 14.6l4.4 3.4-4.4 3.4v-6.8z" fill="#0057FF" />
            <circle cx="23.7" cy="18" r="2.7" fill="#00B873" />
          </svg>
          <div>
            <span class="brand">MyTems</span>
            <span class="brand-sub">Clearnet Vault · $0</span>
          </div>
        </div>
        <button id="settingsBtn" class="icon-btn" title="Dispatch Settings" aria-label="Open Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </header>

      <section class="card">
        <div class="status-row">
          <span id="statusDot" class="dot"></span>
          <span id="statusLabel" class="status-label">Ready to capture tab</span>
          <span id="timer" class="timer" hidden>00:00</span>
        </div>
        <p id="tabTitle" class="tab-title">Detecting tab...</p>

        <div id="preRecordFields" class="field-stack">
          <input id="subjectInput" type="text" list="subjectOptions" placeholder="Subject / group (optional, e.g. Algorithms)" />
          <datalist id="subjectOptions"></datalist>
          <input id="courseHint" type="text" placeholder="Topic hint (optional, helps RO + EN terms)" />
          <div class="toggle-pair">
            <label id="screenToggleRow" class="wb-toggle">
              <input id="screenCaptureCheck" type="checkbox" checked />
              <span>Record screen</span>
            </label>
            <label id="wbToggleRow" class="wb-toggle">
              <input id="wbCaptureCheck" type="checkbox" />
              <span>MS Whiteboard</span>
            </label>
          </div>
        </div>

        <button id="toggleBtn" class="primary-btn">Start Recording</button>
        <p id="dispatchStatus" class="dispatch-status" hidden></p>
        <p id="errorMsg" class="error" role="alert" hidden></p>
      </section>

      <button id="dashboardBtn" class="secondary-btn">
        <span>Open Storefront Catalog</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14" /><path d="m12 5 7 7-7 7" />
        </svg>
      </button>

      <div id="updateBanner" class="update-banner" hidden>
        <span id="updateBannerText" class="update-banner-text">Update available</span>
        <button id="updateBannerBtn" class="update-banner-btn" type="button">Get update</button>
      </div>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
