name: Auto Release Extension Zip

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Run tests
        run: bun test

  release:
    needs: test
    if: >-
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Resolve and bump version
        id: ver
        run: |
          NEXT_VER="$(bun -e '
            const fs = require("fs");
            const { execSync } = require("child_process");
            const parse = (v) => String(v || "").replace(/^v/i, "").split(".").map(Number);
            const cmp = (a, b) => {
              const pa = parse(a), pb = parse(b);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] || 0) > (pb[i] || 0)) return 1;
                if ((pa[i] || 0) < (pb[i] || 0)) return -1;
              }
              return 0;
            };
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tags = execSync("git tag --list \"v*\" --sort=-v:refname", { encoding: "utf8" })
              .trim()
              .split("\n")
              .filter(Boolean);
            const latestTag = tags[0] || "v0.0.0";
            let next = manifest.version;
            if (cmp(manifest.version, latestTag) <= 0) {
              const [maj = 0, min = 0, pat = 0] = parse(latestTag);
              next = `${maj}.${min}.${pat + 1}`;
            }
            if (manifest.version !== next) {
              manifest.version = next;
              fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");
            }
            if (pkg.version !== next) {
              pkg.version = next;
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            }
            console.log(next);
          ')"
          echo "version=$NEXT_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT_VER" >> "$GITHUB_OUTPUT"

      - name: Commit bumped version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain manifest.json package.json)" ]]; then
            git add manifest.json package.json
            git commit -m "chore: bump version to ${{ steps.ver.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Build extension zip
        run: |
          mkdir -p dist/MyTems
          cp manifest.json dist/MyTems/
          cp -R src icons dist/MyTems/
          (cd dist && zip -rq ../mytems.zip MyTems && cp ../mytems.zip "../mytems-${{ steps.ver.outputs.tag }}.zip")

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            mytems.zip
            mytems-*.zip
